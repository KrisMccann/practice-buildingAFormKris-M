<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Form</title>
</head>

<body>

    <form>

    <fieldset>
        <legend>Personal Information</legend>

        <label for="FullName">Full Name:</label>
        <input
            type="text"
            id="fullName"
            name="fullName"
            placeholder="Enter your full name"
            required
            >

            <br><br>

            <label for="email">Email Address:</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email address"
                required
                
                >

                <br><br>

                <label for="password">Password:</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    minlength="8"
                    maxlength="20"
                    required
                    >

                
            

    </fieldset>

    <br>

            <fieldset>
                <legend>Feedback Information</legend>

                <label for="feedback">Feedback Category:</label>

                <select id="category" name="category" required>
                    <option value="gen">General</option>
                    <option value="tech">Technical Feedback</option>
                    <option value="broken link">Broken Link</option>
                    <option value="login information">Login Information</option>
                    <option value="Phishing">Report Phishing</option>
                </select>

                <br><br>

                
                <label for="comments">Comments</label>

                <br>

                <textarea
                    id="comments"
                    name="comments"
                    rows="7"
                    cols="50"
                    placeholder="Tell us about your experience"

                    ></textarea>


                </fieldset>

                <br>

                <fieldset>
                    <legend>Preferred Contact Method</legend>
                    <input
                        type="radio"
                        id="contactEmail"
                        name="contactMethod"
                        value="email"
                        checked
                        >
                        <label for="contactEmail">Email</label>

                        <br>

                        <input
                            type="radio"
                            id="contactPhone"
                            name="contactMethod"
                            value="phone"

                            >
                            <label for="contactPhone">Phone</label>

                            <br>

                            <input
                                type="radio"
                                id="carrierPigeon"
                                name="contactMethod"
                                value="Pigeon"

                                >
                                <label for="carrierPigeon">Carrier Pigeon</label>

                         </fieldset>

                         <br>

                         <fieldset>
                            <legend>Additional Features of Interest</legend>

                            <input
                                type="checkbox"
                                id="desktop"
                                name="interest"
                                value="desktop"

                                >
                                <label for="desktop">Desktop</label>

                                <input
                                type="checkbox"
                                id="tablet"
                                name="interest"
                                value="tablet"

                                >
                                <label for="tablet">Tablet</labelfor>

                                
                                    <br>

                                    <input
                                        type="checkbox"
                                        id="Phone"
                                        name="interest"
                                        value="phone"

                                        >
                                        <label for="phone">Phone</label>
                                        
                                        </fieldset>

                                        <br>

                                        <button type="reset">Submit Feedback</button>

                                    </form>
